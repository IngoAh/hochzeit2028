<!DOCTYPE html>

<head>

    :root {
      --primary-color: #007bff;
      --accent-color: #ff3b30;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      max-width: 500px;
      width: 100%;
      text-align: center;
    }

    /* Countdown Styling */
    .timer-display {
      display: flex;
      justify-content: space-between;
      margin: 25px 0;
    }

    .time-unit {
      flex: 1;
      margin: 0 4px;
      padding: 12px 8px;
      background: #f8f9fa;
      border-radius: 8px;
      border: 1px solid #e9ecef;
    }

    .time-unit .number {
      display: block;
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--primary-color);
    }

    .time-unit .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: #6c757d;
    }

    /* Auffälliger Neuigkeiten-Button */
    .news-accordion {
      margin-top: 20px;
      text-align: left;
    }

    .news-toggle {
      width: 100%;
      background: linear-gradient(135deg, #ff5e36, #ff2a6d);
      color: white;
      border: none;
      padding: 16px 20px;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(255, 42, 109, 0.35);
      transition: transform 0.2s, box-shadow 0.2s, background 0.3s;
      position: relative;
      animation: pulse-attention 2.5s infinite;
    }

    .news-toggle:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 42, 109, 0.45);
    }

    .news-toggle-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-new {
      background-color: #ffffff;
      color: #ff2a6d;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 20px;
      text-transform: uppercase;
    }

    .arrow-icon {
      font-size: 0.85rem;
      transition: transform 0.3s ease;
      background: rgba(255, 255, 255, 0.2);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Zustand wenn geöffnet */
    .news-toggle.active {
      animation: none;
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
    }

    .news-toggle.active .arrow-icon {
      transform: rotate(180deg);
    }

    /* Aufklappbarer Inhalt */
    .news-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s cubic-bezier(0, 1, 0, 1), padding 0.35s ease;
      background: #fff;
      border: 2px solid #ff2a6d;
      border-top: none;

      border-bottom-right-radius: 12px;
      padding: 0 20px;
    }

    .news-content.open {
      max-height: 1000px; /* Ausreichend Platz für Inhalte */
